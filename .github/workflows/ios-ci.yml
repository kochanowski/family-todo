# iOS CI/CD Pipeline using Fastlane
# Builds, tests, and deploys to TestFlight

name: iOS CI

on:
  push:
    branches: [main, fix/tasks-ideas-sync, fix/tasks-ideas-sync-new-implementation, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud_sync_profile:
        description: Cloud sync profile for this manual run
        required: false
        default: preview-local
        type: choice
        options:
          - preview-local
          - sync-enabled

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Notify: build started
  # ─────────────────────────────────────────────────────────────────────────
  notify-start:
    name: Notify Start (Telegram)
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram start message
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Telegram secrets not configured. Skipping start notification."
            exit 0
          fi

          escape_html() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          JOB_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="$(escape_html '${{ github.ref_name }}')"
          SHORT_SHA="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          EVENT_NAME="$(escape_html '${{ github.event_name }}')"
          ACTOR="$(escape_html '${{ github.actor }}')"
          MSG=$(printf '🚀 <b>CI started</b>\nBranch: <code>%s</code>\nCommit: <code>%s</code>\nEvent: <code>%s</code>\nActor: <code>%s</code>\n<a href="%s">Open run</a>' "${BRANCH}" "${SHORT_SHA}" "${EVENT_NAME}" "${ACTOR}" "${JOB_URL}")
          curl -fsS --retry 3 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" || {
              echo "::warning::Telegram start notification failed."
            }

  # ─────────────────────────────────────────────────────────────────────────
  # Tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Clean DerivedData
        run: |
          echo "Cleaning DerivedData to ensure fresh build..."
          rm -rf ~/Library/Developer/Xcode/DerivedData
          echo "DerivedData cleaned successfully"

      - name: Run tests
        id: run_tests
        continue-on-error: true
        env:
          CLOUD_SYNC_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cloud_sync_profile || 'preview-local' }}
        run: |
          set -o pipefail

          HP_CLOUDKIT_ENABLED="NO"
          if [ "$CLOUD_SYNC_PROFILE" = "sync-enabled" ]; then
            HP_CLOUDKIT_ENABLED="YES"
          fi
          echo "Cloud sync profile: $CLOUD_SYNC_PROFILE (HPCloudKitEnabled=$HP_CLOUDKIT_ENABLED)"

          # Find first available iOS simulator
          SIMULATOR_ID=$(xcrun simctl list devices available --json | \
            jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | .[0].value | .[0].udid')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

          # GitHub runs bash with -e enabled, so capture the pipeline status manually
          # before deciding whether a non-zero xcodebuild exit was a real test failure.
          set +e
          xcodebuild test \
            -project FamilyTodo.xcodeproj \
            -scheme HousePulse \
            -only-testing:FamilyTodoTests \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            INFOPLIST_KEY_HPCloudKitEnabled="$HP_CLOUDKIT_ENABLED" \
            OTHER_SWIFT_FLAGS='$(inherited) -D CI' \
            2>&1 | tee xcodebuild-test.log | bundle exec xcpretty

          xcodebuild_status=${PIPESTATUS[0]}
          tee_status=${PIPESTATUS[1]}
          xcpretty_status=${PIPESTATUS[2]}
          set -e

          echo "xcodebuild_status=$xcodebuild_status" >> "$GITHUB_OUTPUT"
          echo "tee_status=$tee_status" >> "$GITHUB_OUTPUT"
          echo "xcpretty_status=$xcpretty_status" >> "$GITHUB_OUTPUT"

          if [ "$tee_status" -ne 0 ] || [ "$xcpretty_status" -ne 0 ]; then
            echo "::group::xcodebuild-test.log (tail)"
            tail -n 200 xcodebuild-test.log || true
            echo "::endgroup::"
            exit 1
          fi

          exit "$xcodebuild_status"

      - name: Verify test result
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            exit 0
          fi

          if rg -q 'with 0 failures \(0 unexpected\)' xcodebuild-test.log &&
             ! rg -q "Test Case '.*' failed" xcodebuild-test.log; then
            echo "::warning::xcodebuild exited with code ${{ steps.run_tests.outputs.xcodebuild_status }} even though no failing test cases were reported and test output indicates zero failures. Accepting this known runner false negative."
            exit 0
          fi

          echo "::group::xcodebuild-test.log (tail)"
          tail -n 200 xcodebuild-test.log || true
          echo "::endgroup::"
          exit 1

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HousePulse-TestResults
          path: TestResults.xcresult

  # ─────────────────────────────────────────────────────────────────────────
  # Build
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: [test]
    if: >
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Clean DerivedData
        run: |
          echo "Cleaning DerivedData to ensure fresh build..."
          rm -rf ~/Library/Developer/Xcode/DerivedData
          echo "DerivedData cleaned successfully"

      - name: Build (no signing)
        env:
          CLOUD_SYNC_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cloud_sync_profile || 'preview-local' }}
        run: |
          set -o pipefail

          HP_CLOUDKIT_ENABLED="NO"
          if [ "$CLOUD_SYNC_PROFILE" = "sync-enabled" ]; then
            HP_CLOUDKIT_ENABLED="YES"
          fi
          echo "Cloud sync profile: $CLOUD_SYNC_PROFILE (HPCloudKitEnabled=$HP_CLOUDKIT_ENABLED)"

          SIMULATOR_ID=$(xcrun simctl list devices available --json | \
            jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | .[0].value | .[0].udid')

          xcodebuild clean build \
            -project FamilyTodo.xcodeproj \
            -scheme HousePulse \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            INFOPLIST_KEY_HPCloudKitEnabled="$HP_CLOUDKIT_ENABLED" \
            OTHER_SWIFT_FLAGS='$(inherited) -D CI' \
            2>&1 | tee xcodebuild-build.log | bundle exec xcpretty || { \
              status=$?; \
              echo "::group::xcodebuild-build.log (tail)"; \
              tail -n 200 xcodebuild-build.log || true; \
              echo "::endgroup::"; \
              exit $status; \
            }

  # ─────────────────────────────────────────────────────────────
  # SwiftLint
  # ─────────────────────────────────────────────────────────────
  swiftlint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # ─────────────────────────────────────────────────────────────
  # CloudKit schema gate (Development -> Production)
  # ─────────────────────────────────────────────────────────────
  cloudkit-schema:
    name: CloudKit Schema Gate
    needs: [swiftlint]
    # On the sync-fix branch, keep schema validation in push CI but avoid re-applying dev schema,
    # because InviteToken security roles are still manually managed in CloudKit Console.
    # Use workflow_dispatch when you intentionally want to run a development apply on this branch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/fix/tasks-ideas-sync' ||
          startsWith(github.ref, 'refs/heads/feature/')
        )
      )
    uses: ./.github/workflows/cloudkit-schema.yml
    with:
      promote_to_production: false
      dry_run: true
      schema_source: cloudkit/schema/housepulse-schema.json
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Deploy to TestFlight (Fastlane)
  # ─────────────────────────────────────────────────────────────
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    needs: [test, build, swiftlint, cloudkit-schema]
    # Run on release/testing lanes and selected feature lanes after the full validation stack passes.
    if: >
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.build.result == 'success' &&
      needs.swiftlint.result == 'success' &&
      (needs['cloudkit-schema'].result == 'success' || needs['cloudkit-schema'].result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/fix/tasks-ideas-sync' ||
            github.ref == 'refs/heads/fix/tasks-ideas-sync-new-implementation' ||
            startsWith(github.ref, 'refs/heads/feature/')
          )
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          decode_base64() {
            # GNU coreutils uses `--decode`, macOS uses `-D`. Support both.
            if base64 --help 2>/dev/null | grep -q -- '--decode'; then
              base64 --decode
            else
              base64 -D
            fi
          }

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          # Create and configure a dedicated keychain for CI
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Import certificate (.p12) into keychain
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | decode_base64 > "$CERT_PATH"
          # Validate the PKCS#12 upfront to fail with a clearer error message.
          openssl pkcs12 -info -in "$CERT_PATH" -passin pass:"$P12_PASSWORD" -noout >/dev/null

          # `-A` avoids interactive prompts ("User interaction is not allowed") during codesign in CI.
          # The import may output "Cannot parse a NULL or zero-length data" warning to stderr,
          # but the identity is still imported successfully. Redirect stderr to avoid pipefail issues.
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security 2>&1 || true

          # Verify the certificate was imported (also redirect stderr)
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>&1 || true)
          echo "$IDENTITIES"
          if ! echo "$IDENTITIES" | grep -q "Apple Distribution"; then
            echo "::error::Failed to import signing certificate"
            exit 1
          fi
          echo "Certificate verified successfully"

          # Install provisioning profile
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | decode_base64 > "$PROFILE_PATH"

          # Extract profile plist (security cms may output warnings to stderr)
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null)
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin)

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          # Debug: show installed profile
          echo "Profile: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

      - name: Deploy to TestFlight
        env:
          # App Store Connect API Key (create at App Store Connect → Users → Keys)
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          # App configuration
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          # Build number from GitHub run
          BUILD_NUMBER: ${{ github.run_number }}
          # Force CloudKit-enabled TestFlight archives.
          HP_CLOUDKIT_ENABLED: "YES"
          # Use the keychain we created in CI (avoid fastlane creating another)
          SKIP_FASTLANE_SETUP_CI: "1"
        run: |
          echo "Deploy profile: HPCloudKitEnabled=$HP_CLOUDKIT_ENABLED"
          bundle exec fastlane beta

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HousePulse-IPA
          path: build/HousePulse.ipa
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Notify: final CI summary
  # ─────────────────────────────────────────────────────────────
  notify-summary:
    name: Notify Summary (Telegram)
    runs-on: ubuntu-latest
    needs: [test, build, swiftlint, cloudkit-schema, deploy-testflight]
    if: always()

    steps:
      - name: Send Telegram summary message
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Telegram secrets not configured. Skipping summary notification."
            exit 0
          fi

          escape_html() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          icon_for_result() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🛑" ;;
              skipped) echo "⏭" ;;
              *) echo "❔" ;;
            esac
          }

          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          LINT_RESULT="${{ needs.swiftlint.result }}"
          CLOUDKIT_RESULT="${{ needs['cloudkit-schema'].result }}"
          DEPLOY_RESULT="${{ needs['deploy-testflight'].result }}"

          FINAL_TITLE="✅ CI succeeded"
          if [ "$TEST_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "failure" ] || [ "$LINT_RESULT" = "failure" ] || [ "$CLOUDKIT_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "failure" ] || \
             [ "$TEST_RESULT" = "cancelled" ] || [ "$BUILD_RESULT" = "cancelled" ] || [ "$LINT_RESULT" = "cancelled" ] || [ "$CLOUDKIT_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            FINAL_TITLE="❌ CI failed"
          fi

          FAILED_STAGES=""
          [ "$TEST_RESULT" = "failure" ] || [ "$TEST_RESULT" = "cancelled" ] && FAILED_STAGES="${FAILED_STAGES}• Tests (${TEST_RESULT})\n"
          [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "cancelled" ] && FAILED_STAGES="${FAILED_STAGES}• Build and Test (${BUILD_RESULT})\n"
          [ "$LINT_RESULT" = "failure" ] || [ "$LINT_RESULT" = "cancelled" ] && FAILED_STAGES="${FAILED_STAGES}• SwiftLint (${LINT_RESULT})\n"
          [ "$CLOUDKIT_RESULT" = "failure" ] || [ "$CLOUDKIT_RESULT" = "cancelled" ] && FAILED_STAGES="${FAILED_STAGES}• CloudKit Schema Gate (${CLOUDKIT_RESULT})\n"
          [ "$DEPLOY_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "cancelled" ] && FAILED_STAGES="${FAILED_STAGES}• Deploy to TestFlight (${DEPLOY_RESULT})\n"

          JOB_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="$(escape_html '${{ github.ref_name }}')"
          SHORT_SHA="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          EVENT_NAME="$(escape_html '${{ github.event_name }}')"
          ACTOR="$(escape_html '${{ github.actor }}')"

          STATUS_LINES="$(printf '%s <b>SwiftLint</b>: <code>%s</code>\n' "$(icon_for_result "$LINT_RESULT")" "$LINT_RESULT")"
          STATUS_LINES="${STATUS_LINES}$(printf '%s <b>Build and Test</b>: <code>%s</code>\n' "$(icon_for_result "$BUILD_RESULT")" "$BUILD_RESULT")"
          STATUS_LINES="${STATUS_LINES}$(printf '%s <b>CloudKit Schema</b>: <code>%s</code>\n' "$(icon_for_result "$CLOUDKIT_RESULT")" "$CLOUDKIT_RESULT")"
          STATUS_LINES="${STATUS_LINES}$(printf '%s <b>Deploy TestFlight</b>: <code>%s</code>\n' "$(icon_for_result "$DEPLOY_RESULT")" "$DEPLOY_RESULT")"

          MSG=$(printf '%s\nBranch: <code>%s</code>\nCommit: <code>%s</code>\nEvent: <code>%s</code>\nActor: <code>%s</code>\n\n%s' "${FINAL_TITLE}" "${BRANCH}" "${SHORT_SHA}" "${EVENT_NAME}" "${ACTOR}" "${STATUS_LINES}")
          if [ -n "$FAILED_STAGES" ]; then
            MSG="${MSG}\n<b>Failed stages:</b>\n${FAILED_STAGES}"
          fi
          MSG="${MSG}\n<a href=\"${JOB_URL}\">Open run</a>"

          curl -fsS --retry 3 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" || {
              echo "::warning::Telegram summary notification failed."
            }
